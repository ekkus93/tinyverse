# The island template: a sandy island with a hut and a jetty, in a sea
# that is the ground itself (ground = "water"). The format is described in src/template.rs.
title = "Island"
description = "A sandy island in a calm sea: palm trees, rocks, a thatched hut with a hammock, a campfire and a wooden jetty with a rowing boat."

[world]
name = "The Island"
description = "A small island in the sea."
spawn_point = [1.5, 0.04, -11]
ground = "water"
ground_size = 1024
time_of_day = 16

# ---- Sand and shallow water (thin discs, a few centimetres above the sea). The sand, grass, hut
# floor and jetty deck are solid, so avatars walk on them; the shallows are not, so they are open
# water where avatars swim.

