# The house template: a small house with four rooms in a fenced garden.
# The format is described in src/template.rs.
title = "House"
description = "A small house in a fenced garden: living room, kitchen, bedroom and bathroom under a pitched roof, with a path to the door, flower beds, a pond and trees."

