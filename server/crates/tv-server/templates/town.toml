# The town template: a square with a fountain among houses and shops.
# The format is described in src/template.rs.
title = "Town"
description = "A small town square with a fountain, trees, benches and street lamps, surrounded by houses and shops of different sizes and colours, with streets leading away."

[world]
name = "The Town"
description = "A town square with a fountain."
spawn_point = [0, 0, -11]
ground = "grass"
ground_size = 512
time_of_day = 10.5

