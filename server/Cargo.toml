[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ekkus93/tinyverse"

# Every third-party dependency is declared here once. Crates opt in with
# `name.workspace = true`, so versions stay in step across the workspace.
[workspace.dependencies]
tv-proto = { path = "crates/tv-proto" }
tv-world = { path = "crates/tv-world" }
tv-store = { path = "crates/tv-store" }

anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
glam = "0.34"
hex = "0.4"
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
rand = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
