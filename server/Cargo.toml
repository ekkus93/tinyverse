[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ekkus93/tinyverse"

# Every third-party dependency is declared here once. Crates opt in with
# `name.workspace = true`, so versions stay in step across the workspace.
[workspace.dependencies]
tv-proto = { path = "crates/tv-proto" }
tv-world = { path = "crates/tv-world" }
tv-store = { path = "crates/tv-store" }

anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
glam = "0.34"
hex = "0.4"
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
rand = "0.10"
# TLS: rustls with the `ring` provider only. Keep aws-lc-rs out of the build:
# with two providers compiled in, rustls cannot pick a process default and
# clients that rely on it (tungstenite's `wss://`) would panic.
rcgen = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
